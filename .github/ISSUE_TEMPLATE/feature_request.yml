name: 기능 요청
description: 새로운 기능이나 사용자 경험 개선을 제안합니다.
title: "[기능] "
labels:
  - enhancement
body:
  - type: textarea
    id: background
    attributes:
      label: 배경과 문제
      description: 누가 어떤 상황에서 불편한지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 원하는 사용자 흐름과 핵심 동작을 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 무엇이 가능해지면 완료인지 확인 가능한 문장으로 작성해 주세요.
      placeholder: |
        - 사용자는 ...할 수 있다.
        - 관리자는 ...을 확인할 수 있다.
    validations:
      required: true

  - type: textarea
    id: exclusions
    attributes:
      label: 이번 범위에서 제외할 내용
      description: 함께 구현하지 않을 기능이나 추후 과제를 작성해 주세요.

  - type: dropdown
    id: area
    attributes:
      label: 주요 영역
      options:
        - 회원·인증
        - 공지사항
        - 커뮤니티·댓글
        - 일정·시간표
        - 알림
        - 관리자·신고
        - UI/UX
        - 운영·문서
        - 기타
    validations:
      required: true

  - type: textarea
    id: policy
    attributes:
      label: 정책·보안 고려사항
      description: 권한, 삭제, 개인정보, 알림, 운영 정책에 영향을 주는 내용을 작성해 주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 기존 기능과 로드맵에 같은 요청이 있는지 확인했습니다.
          required: true
        - label: 비밀번호, 토큰, 서비스 계정, 개인정보를 포함하지 않았습니다.
          required: true
