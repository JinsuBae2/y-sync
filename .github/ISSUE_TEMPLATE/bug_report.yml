name: 버그 신고
description: 재현 가능한 오류나 운영 문제를 제보합니다.
title: "[버그] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        비밀번호, 토큰, 서비스 계정, 개인정보가 포함된 화면이나 로그는 첨부하지 마세요.

  - type: dropdown
    id: environment
    attributes:
      label: 발생 환경
      options:
        - 운영 PWA
        - 로컬 Flutter Web
        - 로컬 Backend
        - GitHub Actions
        - Oracle Cloud 운영 환경
        - 기타
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 문제 설명
      description: 어떤 문제가 발생했고 사용자에게 어떤 영향이 있는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      placeholder: |
        1. 로그인한다.
        2. 커뮤니티 화면으로 이동한다.
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 브라우저·기기·앱 버전
      placeholder: 예) macOS Safari, iPhone 설치형 PWA

  - type: textarea
    id: evidence
    attributes:
      label: 추가 자료
      description: 민감정보를 제거한 오류 메시지, 화면, Actions 링크 등을 첨부해 주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 동일한 Issue가 이미 등록되어 있는지 확인했습니다.
          required: true
        - label: 첨부 내용에서 비밀값과 개인정보를 제거했습니다.
          required: true
