name: Y-Sync CI/CD Deploy

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x backend/gradlew

      - name: Build Spring Boot JAR
        run: |
          cd backend
          ./gradlew bootJar -x test

      - name: Compress Deploy Artifacts
        run: |
          mkdir -p deploy_dist/backend/build/libs
          mkdir -p deploy_dist/docker
          cp backend/Dockerfile deploy_dist/backend/
          cp backend/build/libs/*.jar deploy_dist/backend/build/libs/
          cp docker/docker-compose.yml deploy_dist/docker/
          tar -czf deploy.tar.gz -C deploy_dist .

      - name: Copy Artifact via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.tar.gz"
          target: "~/ysync"

      - name: Execute Remote SSH Commands (Docker Deploy)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/ysync/app
            mv ~/ysync/deploy.tar.gz ~/ysync/app/
            cd ~/ysync/app
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            cd docker
            
            # DB_PASSWORD 및 JWT_SECRET 환경변수를 반영하여 docker-compose 재시작
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            
            docker compose down || true
            docker compose up -d --build
            
            # 빌드 완료 후 미사용 이미지들을 정리하여 1GB 서버 용량 확보
            docker image prune -f
