name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Test and Build Spring Boot JAR
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test bootJar

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter
        working-directory: frontend
        # 💡 경고와 정보를 모두 CI 실패로 다룹니다. 이전에는 둘 다 무시해서 경고가 26건까지
        #    쌓여도 CI가 통과했습니다. 지금은 0건이므로 이 시점에 게이트를 조입니다.
        run: flutter analyze

      - name: Run Web Gesture and Diagnostics Tests
        working-directory: frontend
        run: node --test test/web/*.cjs

      - name: Run Flutter Tests
        working-directory: frontend
        run: flutter test

      - name: Build Flutter Web
        working-directory: frontend
        run: flutter build web --release

  configuration:
    name: Configuration
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-db-password
      JWT_SECRET: ci-jwt-secret
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: ci-mail-password

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Docker Compose
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Verify MySQL Is Not Published
        run: |
          if docker compose -f docker/docker-compose.yml config \
            | sed -n '/ysync-mysql:/,/ysync-nginx:/p' \
            | grep -Eq 'published:|target: 3306'; then
            echo 'MySQL port 3306 must not be published.' >&2
            exit 1
          fi

  gate:
    name: Gate
    if: always()
    needs:
      - backend
      - frontend
      - configuration
    runs-on: ubuntu-latest

    steps:
      - name: Verify Required Jobs
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CONFIGURATION_RESULT: ${{ needs.configuration.result }}
        run: |
          if [ "$BACKEND_RESULT" != success ] \
            || [ "$FRONTEND_RESULT" != success ] \
            || [ "$CONFIGURATION_RESULT" != success ]; then
            echo 'One or more required CI jobs failed.' >&2
            exit 1
          fi
