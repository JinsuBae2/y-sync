name: Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker/**'
      - 'frontend/**'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:
    inputs:
      component:
        description: Component to deploy from main
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - frontend

permissions:
  contents: read
  checks: write
  deployments: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  detect_changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Deployable Components
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          SELECTED_COMPONENT: ${{ inputs.component }}
        run: |
          backend=false
          frontend=false

          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            case "$SELECTED_COMPONENT" in
              all)
                backend=true
                frontend=true
                ;;
              backend)
                backend=true
                ;;
              frontend)
                frontend=true
                ;;
            esac
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"

            if printf '%s\n' "$changed_files" | grep -Eq '^(backend/|docker/)'; then
              backend=true
            fi
            if printf '%s\n' "$changed_files" | grep -Eq '^frontend/'; then
              frontend=true
            fi
            if printf '%s\n' "$changed_files" | grep -Fxq '.github/workflows/deploy-production.yml'; then
              backend=true
              frontend=true
            fi
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  build_backend:
    name: Build Backend
    if: needs.detect_changes.outputs.backend == 'true'
    needs: detect_changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Test and Build Spring Boot JAR
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test bootJar

      - name: Package Deploy Artifact
        run: |
          mkdir -p deploy_dist/backend/build/libs deploy_dist/docker
          cp backend/Dockerfile deploy_dist/backend/
          cp backend/build/libs/*.jar deploy_dist/backend/build/libs/
          cp docker/docker-compose.yml deploy_dist/docker/
          tar -czf deploy.tar.gz -C deploy_dist .

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-deploy
          path: deploy.tar.gz
          if-no-files-found: error
          retention-days: 7

  build_frontend:
    name: Build Frontend
    if: needs.detect_changes.outputs.frontend == 'true'
    needs: detect_changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter
        working-directory: frontend
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test and Build Flutter Web
        working-directory: frontend
        run: |
          flutter test
          flutter build web --release

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-web
          path: frontend/build/web
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Production
    if: |
      always()
      && needs.detect_changes.result == 'success'
      && (needs.detect_changes.outputs.backend == 'true' || needs.detect_changes.outputs.frontend == 'true')
      && (needs.build_backend.result == 'success' || needs.build_backend.result == 'skipped')
      && (needs.build_frontend.result == 'success' || needs.build_frontend.result == 'skipped')
    needs:
      - detect_changes
      - build_backend
      - build_frontend
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://y-sync-31c03.web.app

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Download Backend Artifact
        if: needs.detect_changes.outputs.backend == 'true'
        uses: actions/download-artifact@v8
        with:
          name: backend-deploy
          path: .

      - name: Copy Backend Artifact via SSH
        if: needs.detect_changes.outputs.backend == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy.tar.gz
          target: ~/ysync

      - name: Deploy Backend
        if: needs.detect_changes.outputs.backend == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER }}
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_PASSWORD,JWT_SECRET,MAIL_USERNAME,MAIL_PASSWORD,STORAGE_PROVIDER,AWS_S3_BUCKET,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script: |
            set -eu
            mkdir -p ~/ysync/app
            mv ~/ysync/deploy.tar.gz ~/ysync/app/
            cd ~/ysync/app
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            cd docker

            previous_backend_image="$(docker inspect --format='{{.Image}}' ysync-backend 2>/dev/null || true)"
            docker compose up -d --build --remove-orphans

            if ! curl --fail --silent --show-error \
              --retry 60 --retry-delay 5 --retry-connrefused \
              https://168-107-29-144.sslip.io/api/v1/hello; then
              if [ -n "$previous_backend_image" ]; then
                docker tag "$previous_backend_image" docker-ysync-backend:latest
                docker compose up -d --no-deps --force-recreate ysync-backend
              fi
              exit 1
            fi

            docker image prune -f

      - name: Download Frontend Artifact
        if: needs.detect_changes.outputs.frontend == 'true'
        uses: actions/download-artifact@v8
        with:
          name: frontend-web
          path: frontend/build/web

      - name: Deploy Frontend to Firebase Hosting
        if: needs.detect_changes.outputs.frontend == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_Y_SYNC_31C03 }}
          projectId: y-sync-31c03
          entryPoint: frontend
          channelId: live
