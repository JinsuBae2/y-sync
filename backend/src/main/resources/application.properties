spring.application.name=y-sync
debug=true

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/ysync_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Firebase Configuration
firebase.config.path=classpath:firebase-adminsdk.json

# JWT Configuration
jwt.secret=${JWT_SECRET:YSyncSuperSecretKeyYSyncSuperSecretKeyYSyncSuperSecretKeyYSyncSuperSecretKey}
jwt.expiration_time=86400000
