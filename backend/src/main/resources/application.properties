spring.application.name=y-sync
debug=true

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/ysync_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Firebase Configuration
# 💡 [FCM 무중단 보완] 환경 변수 FIREBASE_CONFIG_PATH가 주어지면 외부에 마운트된 경로를 사용하고, 없을 경우 classpath의 파일을 기본값으로 사용합니다.
firebase.config.path=${FIREBASE_CONFIG_PATH:classpath:firebase-adminsdk.json}

# JWT Configuration
jwt.secret=${JWT_SECRET:YSyncSuperSecretKeyYSyncSuperSecretKeyYSyncSuperSecretKeyYSyncSuperSecretKey}
jwt.expiration_time=86400000

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-gmail-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
ysync.storage.provider=${STORAGE_PROVIDER:local}
ysync.upload.dir=${UPLOAD_DIR:C:/uploads/y-sync/}
ysync.upload.resource-location=${UPLOAD_RESOURCE_LOCATION:file:///C:/uploads/y-sync/}
ysync.storage.s3.bucket=${AWS_S3_BUCKET:y-sync-attachments-155641294529}
ysync.storage.s3.region=${AWS_REGION:ap-northeast-2}
ysync.storage.s3.presign-duration=${AWS_S3_PRESIGN_DURATION:PT5M}
