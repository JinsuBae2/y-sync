# 💡 Y-Sync Production Profile Configuration

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 💡 HikariCP Connection Pool Optimization for 1GB RAM
# - 80명의 소규모 동기 전용 앱이므로 동시 커넥션을 5개로 제한하여 메모리 누수를 극도로 방어합니다.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA Configuration
# - validate: 서버 기동 시 JPA 엔티티와 실제 DB 테이블 구조가 일치하는지만 검증합니다. (운영 데이터 유실 완벽 차단)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Logging Optimization
# - 디버그성 SQL 출력과 장황한 로깅을 최소화하여 디스크 I/O 성능 저하 및 메모리 병목을 예방합니다.
logging.level.root=INFO
logging.level.com.ync.ysync=INFO
logging.level.org.hibernate.SQL=WARN

# JWT Configuration
jwt.secret=${JWT_SECRET}
# 7일 유효
jwt.expiration_time=604800000

