# 💡 Y-Sync Production Profile Configuration

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 💡 HikariCP Connection Pool Optimization for 1GB RAM
# - 80명의 소규모 동기 전용 앱이므로 동시 커넥션을 5개로 제한하여 메모리 누수를 극도로 방어합니다.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA Configuration
# 💡 validate입니다. Hibernate가 운영 스키마를 자동으로 변경하지 않습니다.
#    2026-09-21에 update에서 전환했습니다. 운영 스키마 덤프를 복제 환경에 올려
#    validate로 기동해 불일치가 0건인 것을 확인한 뒤 바꿨습니다(docs/WORK_LOG.md).
#
#    ⚠️ 이제 엔티티를 바꾸면 운영 DB에 DDL을 직접 적용해야 합니다. 적용하지 않고 배포하면
#    validate가 불일치를 잡아 **기동에 실패합니다.** 절차는 docs/DDL_AUTO_MIGRATION.md 를 따르십시오.
#    엔티티 변경의 영향은 그 문서 4단계로 배포 전에 먼저 확인할 수 있습니다.
#
#    참고: validate는 Hibernate의 자동 스키마 변경을 막는 설정이며, 데이터 유실 자체를
#    막아 주는 기능이 아닙니다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Logging Optimization
# - 디버그성 SQL 출력과 장황한 로깅을 최소화하여 디스크 I/O 성능 저하 및 메모리 병목을 예방합니다.
debug=false
logging.level.root=INFO
logging.level.com.ync.ysync=INFO
logging.level.org.hibernate.SQL=WARN

# 운영 오류 응답에 내부 메시지나 스택 트레이스를 포함하지 않습니다.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# JWT Configuration
jwt.secret=${JWT_SECRET}
# 7일 유효
jwt.expiration_time=604800000

# 💡 Nginx 리버스 프록시 연동 지원 (X-Forwarded-* 헤더 신뢰 설정)
server.forward-headers-strategy=FRAMEWORK

# 운영 환경에서는 API 문서 엔드포인트를 외부에 노출하지 않습니다.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# 학년 및 공지 알림 대상 설정
# 💡 학년도 기준일입니다. 학교 정책이 3월 1일과 다르면 출시 전에 조정합니다. (Asia/Seoul 기준)
ysync.academic-year.cutover-month=${ACADEMIC_YEAR_CUTOVER_MONTH:3}
ysync.academic-year.cutover-day=${ACADEMIC_YEAR_CUTOVER_DAY:1}
# 💡 공지 알림의 학년 필터입니다. 도입 1단계에서는 꺼 두어 기존 발송 범위를 유지하고,
#    학생들의 학년 선택이 충분히 쌓인 뒤 운영자가 전환 시점을 정해 켭니다. 되돌리면 기존 발송 방식으로 복구됩니다.
ysync.notification.grade-filter.enabled=${NOTICE_GRADE_FILTER_ENABLED:false}
