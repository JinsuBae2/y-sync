# 💡 Y-Sync Production Profile Configuration

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 💡 HikariCP Connection Pool Optimization for 1GB RAM
# - 80명의 소규모 동기 전용 앱이므로 동시 커넥션을 5개로 제한하여 메모리 누수를 극도로 방어합니다.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA Configuration
# 💡 현재 값은 update입니다. Hibernate가 기동할 때마다 운영 스키마를 자동으로 변경합니다.
#    (이전 주석은 validate라고 적혀 있었으나 실제 값과 달라 정정했습니다.)
#
#    validate로 전환할 예정이나, 그동안 update로 운영된 스키마가 엔티티와 어긋나 있으면
#    validate는 기동을 실패시키므로 값만 바꾸면 안 됩니다. 전환 절차는
#    docs/DDL_AUTO_MIGRATION.md 를 따르십시오.
#
#    참고: validate는 Hibernate의 자동 스키마 변경을 막는 설정이며, 데이터 유실 자체를
#    막아 주는 기능이 아닙니다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Logging Optimization
# - 디버그성 SQL 출력과 장황한 로깅을 최소화하여 디스크 I/O 성능 저하 및 메모리 병목을 예방합니다.
debug=false
logging.level.root=INFO
logging.level.com.ync.ysync=INFO
logging.level.org.hibernate.SQL=WARN

# 운영 오류 응답에 내부 메시지나 스택 트레이스를 포함하지 않습니다.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# JWT Configuration
jwt.secret=${JWT_SECRET}
# 7일 유효
jwt.expiration_time=604800000

# 💡 Nginx 리버스 프록시 연동 지원 (X-Forwarded-* 헤더 신뢰 설정)
server.forward-headers-strategy=FRAMEWORK

# 운영 환경에서는 API 문서 엔드포인트를 외부에 노출하지 않습니다.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
