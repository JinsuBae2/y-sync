server {
    listen 80;
    listen [::]:80;
    server_name 168-107-29-144.sslip.io;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 💡 인증 API 요청 수 제한 구역.
#
# 교내 Wi-Fi·실습실은 공인 IP를 공유하므로 여러 학생의 요청이 하나의 제한을 소비합니다.
# 따라서 IP 기준 제한은 넉넉하게 두고, 계정 단위의 정밀한 제한은 애플리케이션이 담당합니다
# (challenge당 시도 5회, 재발급 60초 쿨다운). 여기서는 대량 요청을 걸러내는 역할만 합니다.
#
# 메일 발송은 외부 할당량을 소모하므로 가장 엄격하게 둡니다.
limit_req_zone $binary_remote_addr zone=ysync_auth_send:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=ysync_auth_verify:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=ysync_auth_login:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=ysync_auth_common:1m rate=120r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 168-107-29-144.sslip.io;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/168-107-29-144.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/168-107-29-144.sslip.io/privkey.pem;

    # Security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Hide Nginx version
    server_tokens off;

    # Limit client body size
    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;
    # 💡 HTTP는 이미 443으로 301 리다이렉트하므로 평문 폴백이 없습니다. HSTS로 고정합니다.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hide backend internal headers to prevent technology stack exposure
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # 💡 프록시 공통 설정은 server 단에 두고 location에서 상속받습니다.
    #    location마다 중복 선언하면 한쪽만 수정되어 설정이 어긋납니다.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 💡 이전 설정은 proxy_read_timeout이 86400초(24시간)였고 WebSocket Upgrade까지 열려 있었습니다.
    #    현재 백엔드·프론트 모두 WebSocket을 사용하지 않으므로 제거하고, 커넥션을 장시간 붙잡는
    #    방식의 자원 점유를 막기 위해 타임아웃을 현실적인 값으로 내립니다.
    #    관리자 Excel·CSV 일괄 등록이 오래 걸릴 수 있어 읽기 타임아웃은 120초로 둡니다.
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    client_body_timeout 60s;
    client_header_timeout 20s;

    limit_req_status 429;

    # 인증번호·비밀번호 재설정 메일 발송 (외부 메일 할당량 소모)
    location /api/v1/auth/verify-student/send-code {
        limit_req zone=ysync_auth_send burst=10 nodelay;
        proxy_pass http://ysync-backend:8080;
    }

    location /api/v1/auth/password-reset/request {
        limit_req zone=ysync_auth_send burst=10 nodelay;
        proxy_pass http://ysync-backend:8080;
    }

    # 인증번호 검증 (무차별 대입 표적. 정밀 제한은 애플리케이션이 담당)
    location /api/v1/auth/verify-student/verify-code {
        limit_req zone=ysync_auth_verify burst=20 nodelay;
        proxy_pass http://ysync-backend:8080;
    }

    location /api/v1/auth/password-reset/confirm {
        limit_req zone=ysync_auth_verify burst=20 nodelay;
        proxy_pass http://ysync-backend:8080;
    }

    # 로그인 (자격증명 대입 방어. 공유 IP에서 다수가 동시에 로그인할 수 있어 여유를 둠)
    location /api/v1/auth/login {
        limit_req zone=ysync_auth_login burst=20 nodelay;
        proxy_pass http://ysync-backend:8080;
    }

    # 그 외 인증 API (학번 중복 확인, 가입, 로그아웃 등)
    location /api/v1/auth/ {
        limit_req zone=ysync_auth_common burst=40 nodelay;
        proxy_pass http://ysync-backend:8080;
    }

    location / {
        proxy_pass http://ysync-backend:8080;
    }
}
